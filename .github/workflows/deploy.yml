name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # configure-pages reads the Pages config; read only, and never id-token.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm lint
      # The confidentiality blocklist is gitignored; CI gets it from the FORBIDDEN_TERMS secret (one regex per line).
      - run: printf '%s\n' "$FORBIDDEN_TERMS" > e2e/forbidden.local.txt
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
      # e2e builds and serves out/ at the root; the deploy build below is rebuilt with the Pages base path.
      - run: pnpm e2e
        env:
          NO_UPDATE_CHECK: "1"
      # base_path is "" for a <user>.github.io repo and "/<repo>" for a project site.
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # e2e only checks rendered text on the root build; scan every text file of the artifact that actually ships.
      - run: node scripts/scan-out.mjs
      - run: rm -f e2e/forbidden.local.txt
        if: always()
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
